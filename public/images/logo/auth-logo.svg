<svg width="231" height="48" viewBox="0 0 231 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gear Icon with Hard Hat -->
  <g>
    <!-- Gear Circle -->
    <circle cx="24" cy="24" r="16" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Gear Teeth -->
    <rect x="20" y="6" width="8" height="8" fill="#1a1a1a"/>
    <rect x="20" y="34" width="8" height="8" fill="#1a1a1a"/>
    <rect x="6" y="20" width="8" height="8" fill="#1a1a1a"/>
    <rect x="34" y="20" width="8" height="8" fill="#1a1a1a"/>
    <rect x="12" y="12" width="8" height="8" fill="#1a1a1a" transform="rotate(45 16 16)"/>
    <rect x="28" y="12" width="8" height="8" fill="#1a1a1a" transform="rotate(45 32 16)"/>
    <rect x="12" y="28" width="8" height="8" fill="#1a1a1a" transform="rotate(45 16 32)"/>
    <rect x="28" y="28" width="8" height="8" fill="#1a1a1a" transform="rotate(45 32 32)"/>
    <!-- Center hole -->
    <circle cx="24" cy="24" r="8" fill="white"/>
    <!-- Hard Hat -->
    <path d="M12 18 Q24 13 36 18 L36 22 Q32 24 24 24 Q16 24 12 22 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    <path d="M10 20 Q24 15 38 20" stroke="#d97706" stroke-width="1" fill="none"/>
  </g>

  <!-- Paper Cutting Text -->
  <text x="56" y="34" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="white">Paper Cutting</text>
  <!-- Yellow dot on 'i' -->
  <circle cx="132" cy="16" r="3" fill="#f59e0b"/>
  <!-- Registered trademark symbol -->
  <text x="155" y="14" font-family="Arial, sans-serif" font-size="8" fill="white">®</text>
</svg>
