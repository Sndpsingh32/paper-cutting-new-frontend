<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gear Icon with Hard Hat -->
  <g>
    <!-- Gear Circle -->
    <circle cx="30" cy="30" r="20" fill="#e4e7ec" stroke="#e4e7ec" stroke-width="2"/>
    <!-- Gear Teeth -->
    <rect x="26" y="8" width="8" height="10" fill="#e4e7ec"/>
    <rect x="26" y="42" width="8" height="10" fill="#e4e7ec"/>
    <rect x="8" y="26" width="10" height="8" fill="#e4e7ec"/>
    <rect x="42" y="26" width="10" height="8" fill="#e4e7ec"/>
    <rect x="14" y="14" width="8" height="8" fill="#e4e7ec" transform="rotate(45 18 18)"/>
    <rect x="38" y="14" width="8" height="8" fill="#e4e7ec" transform="rotate(45 42 18)"/>
    <rect x="14" y="38" width="8" height="8" fill="#e4e7ec" transform="rotate(45 18 42)"/>
    <rect x="38" y="38" width="8" height="8" fill="#e4e7ec" transform="rotate(45 42 42)"/>
    <!-- Center hole -->
    <circle cx="30" cy="30" r="10" fill="white"/>
    <!-- Hard Hat -->
    <path d="M15 22 Q30 15 45 22 L45 28 Q40 32 30 32 Q20 32 15 28 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <path d="M12 25 Q30 18 48 25" stroke="#d97706" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Paper Cutting Text -->
  <text x="70" y="42" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">Paper Cutting</text>
  <!-- Yellow dot on 'i' -->
  <circle cx="162" cy="20" r="4" fill="#f59e0b"/>
  <!-- Registered trademark symbol -->
  <text x="185" y="18" font-family="Arial, sans-serif" font-size="10" fill="white">®</text>
</svg>
